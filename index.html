<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff6f3" />
  <meta name="color-scheme" content="light" />
  <title>Ideal Farma · Beauty Bar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600;700&family=Oooh+Baby&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #3a1824;
      --muted: #6a3e4e;
      --cream: #fff6f3;
      --card: #ffffff;
      --line: #f0d4de;
      --blush: #f7d5e2;
      --rose: #e7a3b8;
      --hot: #e21878;
      --deep: #4e1c32;
      --gold: #c6a36a;
      --gold-deep: #6e5224;
      --wine: #4a1830;
    }

    * { box-sizing: border-box; }
    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--cream);
    }
    body {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      color: var(--ink);
      font-family: "Nunito", "Trebuchet MS", sans-serif;
      font-size: 16px;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; color: inherit; }
    button {
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--hot);
      outline-offset: 3px;
    }
    ::selection { background: #f7c1d6; color: var(--ink); }

    .phone {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(120% 42% at 50% -8%, rgba(231, 163, 184, 0.38), transparent 58%),
        var(--cream);
    }

    .atmosphere {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .atmosphere span {
      position: absolute;
      border-radius: 50%;
      filter: blur(18px);
      opacity: 0.55;
    }
    .atmosphere span:nth-child(1) {
      width: 210px;
      height: 210px;
      background: #f6c6d8;
      top: -70px;
      right: -60px;
      animation: drift 14s ease-in-out infinite;
    }
    .atmosphere span:nth-child(2) {
      width: 160px;
      height: 160px;
      background: #f3e2c4;
      bottom: 12%;
      left: -50px;
      animation: drift 16s ease-in-out infinite reverse;
    }
    .atmosphere span:nth-child(3) {
      width: 120px;
      height: 120px;
      background: #f7d5e4;
      top: 42%;
      right: -40px;
      opacity: 0.4;
      animation: drift 12s ease-in-out infinite 1s;
    }
    @keyframes drift {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(-12px, 16px, 0); }
    }

    #app {
      position: relative;
      z-index: 1;
      height: 100%;
      min-height: 0;
    }

    .screen {
      height: 100%;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding:
        calc(16px + env(safe-area-inset-top))
        20px
        calc(18px + env(safe-area-inset-bottom));
    }
    .screen::-webkit-scrollbar { width: 0; height: 0; }

    .screen.from-forward { animation: enter-forward 0.46s cubic-bezier(.22, .8, .2, 1); }
    .screen.from-back { animation: enter-back 0.46s cubic-bezier(.22, .8, .2, 1); }
    .screen.from-none { animation: enter-fade 0.55s ease; }
    @keyframes enter-forward {
      from { opacity: 0; transform: translateX(42px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes enter-back {
      from { opacity: 0; transform: translateX(-42px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes enter-fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .screen.intro,
    .screen.name,
    .screen.brew,
    .screen.result {
      display: flex;
      flex-direction: column;
    }
    .screen.intro .actions,
    .screen.brew .actions { margin-top: auto; }

    .kicker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 580;
      color: var(--gold-deep);
    }
    .kicker.center { justify-content: center; }

    .compact {
      position: relative;
      width: 230px;
      height: 188px;
      margin: 8px auto 4px;
      pointer-events: none;
    }
    .petal {
      position: absolute;
      width: 16px;
      height: 26px;
      border-radius: 80% 80% 70% 12%;
      background: linear-gradient(160deg, #fde7ef, #e7a3b8 55%, #c6a36a);
      opacity: 0.8;
      animation: floaty 7s ease-in-out infinite;
    }
    .petal.a { top: 18px; left: 18px; transform: rotate(-28deg); }
    .petal.b { top: 6px; right: 36px; width: 12px; height: 20px; animation-delay: -1.4s; }
    .petal.c { bottom: 28px; left: 8px; transform: rotate(18deg); animation-delay: -2.2s; }
    .petal.d { top: 46px; right: 8px; transform: rotate(32deg); animation-delay: -3s; }
    .petal.e { bottom: 18px; right: 28px; width: 11px; height: 18px; animation-delay: -4s; }
    @keyframes floaty {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -8px; }
    }

    .mirror {
      position: absolute;
      left: 50%;
      top: 46%;
      width: 142px;
      height: 142px;
      transform: translate(-50%, -50%);
      animation: open-compact 0.9s cubic-bezier(.2, .8, .24, 1);
    }
    @keyframes open-compact {
      from { opacity: 0; transform: translate(-50%, -46%) scale(0.72); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    .mirror-ring {
      position: absolute;
      inset: -14px;
      width: calc(100% + 28px);
      height: calc(100% + 28px);
    }
    .mirror-ring circle {
      fill: none;
      stroke: #c6a36a;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-dasharray: 402;
      stroke-dashoffset: 402;
      animation: draw-ring 1.15s ease forwards 0.12s;
    }
    @keyframes draw-ring { to { stroke-dashoffset: 0; } }
    .glass {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 34% 30%, #fff 0%, #fdeef3 38%, #f0c2d2 72%, #e7c3a4 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.85),
        inset 0 -16px 24px rgba(226, 24, 120, 0.08),
        0 0 0 7px rgba(198, 163, 106, 0.22),
        0 0 0 9px #d7b98a,
        0 16px 34px rgba(74, 24, 48, 0.16);
    }
    .glass strong {
      position: relative;
      z-index: 1;
      font-family: "Cormorant Garamond", Palatino, serif;
      font-weight: 600;
      font-size: 46px;
      letter-spacing: 0.04em;
      color: var(--deep);
    }
    .shimmer {
      position: absolute;
      inset: -30%;
      background: linear-gradient(115deg, transparent 36%, rgba(255, 255, 255, 0.82) 48%, transparent 60%);
      transform: translateX(-70%) rotate(8deg);
      animation: shimmer 3.4s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%, 58% { transform: translateX(-78%) rotate(8deg); }
      82%, 100% { transform: translateX(78%) rotate(8deg); }
    }

    h1, h2, h3 {
      font-family: "Cormorant Garamond", Palatino, serif;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0;
    }
    h1 {
      font-size: clamp(40px, 10vw, 50px);
      line-height: 0.9;
      text-align: center;
    }
    h1 em, h2 em {
      font-family: "Oooh Baby", "Segoe Script", cursive;
      font-style: normal;
      font-weight: 400;
      font-size: 1.22em;
      letter-spacing: 0;
      line-height: 1;
      color: var(--hot);
      display: inline-block;
      padding: 0.08em 0.04em 0;
    }
    .lede {
      text-align: center;
      color: var(--muted);
      line-height: 1.45;
      margin: 12px auto 0;
      max-width: 32ch;
      font-size: 16.5px;
    }
    .deck {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.4;
    }

    .actions, .dock { display: grid; gap: 8px; }
    .screen.intro .actions { padding-top: 16px; width: 100%; }

    .btn {
      border: 0;
      border-radius: 999px;
      min-height: 56px;
      padding: 14px 18px;
      background: linear-gradient(180deg, #7a2b4a 0%, #4a1830 100%);
      color: #fff8f6;
      font-size: 16px;
      font-weight: 580;
      letter-spacing: 0.01em;
      box-shadow: 0 10px 24px rgba(74, 24, 48, 0.22);
    }
    .btn:active { transform: scale(0.985); }
    .btn.gold {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #f0ddb4 0%, #c6a36a 52%, #b08a49 100%);
      color: #3a2410;
      box-shadow: 0 10px 24px rgba(140, 106, 50, 0.28);
    }
    .btn.gold::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.48) 50%, transparent 68%);
      transform: translateX(-130%);
      animation: sheen 3.2s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes sheen {
      0%, 62% { transform: translateX(-130%); }
      100% { transform: translateX(130%); }
    }
    .btn.ghost {
      background: transparent;
      color: var(--deep);
      box-shadow: none;
      border: 1px solid rgba(198, 163, 106, 0.85);
    }

    .fine, .legal {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }
    .fine { margin: 0 0 10px; }
    .legal { margin: 14px 0 4px; text-align: left; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
      gap: 12px;
    }
    .back {
      border: 0;
      background: transparent;
      color: var(--deep);
      min-height: 52px;
      min-width: 52px;
      padding: 0 10px 0 0;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 16px;
      font-weight: 480;
    }
    .back svg { display: block; }

    .compass {
      width: 48px;
      height: 48px;
      position: relative;
      flex: none;
    }
    .compass .well {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.82);
    }
    .compass .well i {
      position: absolute;
      left: -25%;
      width: 150%;
      bottom: 0;
      height: calc(var(--p) * 100%);
      background: linear-gradient(180deg, #f8d5e3 0%, #e7a3b8 46%, #c6a36a 100%);
      transition: height 0.55s cubic-bezier(.2, .8, .2, 1);
    }
    .compass .well i::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: -5px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
    }
    .compass svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .compass .track,
    .compass .value {
      fill: none;
      stroke-width: 2.4;
    }
    .compass .track { stroke: rgba(198, 163, 106, 0.4); }
    .compass .value {
      stroke: #b8894a;
      stroke-linecap: round;
      stroke-dasharray: 97.39;
      stroke-dashoffset: calc(97.39 * (1 - var(--p)));
      transition: stroke-dashoffset 0.55s cubic-bezier(.2, .8, .2, 1);
    }
    .compass-num {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 580;
      color: var(--deep);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
    }

    .meter {
      height: 9px;
      margin: 2px 0 0;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(198, 163, 106, 0.45);
      overflow: hidden;
    }
    .meter span {
      display: block;
      height: 100%;
      width: calc(var(--p) * 100%);
      border-radius: inherit;
      background: linear-gradient(90deg, #e21878 0%, #e7a3b8 46%, #c6a36a 100%);
      position: relative;
      transition: width 0.55s cubic-bezier(.2, .8, .2, 1);
    }
    .meter span::after {
      content: "";
      position: absolute;
      top: -3px;
      right: -2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, #fff, #f7c1d6 42%, #c6a36a);
      box-shadow: 0 0 0 3px rgba(198, 163, 106, 0.22);
    }

    .question { margin: 18px 0 14px; }
    .question p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.4;
      font-size: 16px;
    }
    h2 { font-size: clamp(32px, 8vw, 38px); line-height: 1.02; }

    .options { display: grid; gap: 10px; }
    .opt {
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      min-height: 68px;
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 12px;
      align-items: center;
      box-shadow: 0 8px 20px rgba(92, 32, 56, 0.04);
      position: relative;
      overflow: hidden;
    }
    .opt:active { transform: scale(0.985); }
    .opt .copy strong {
      display: block;
      font-weight: 580;
      font-size: 16.5px;
      color: var(--ink);
    }
    .opt .copy small {
      display: block;
      color: var(--muted);
      font-size: 13.5px;
      margin-top: 2px;
      line-height: 1.35;
    }
    .glyph {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: #fff0f5;
      color: var(--hot);
    }
    .options.is-frozen .opt:not(.picked) { opacity: 0.42; }
    .opt.picked {
      border-color: #c6a36a;
      background: linear-gradient(105deg, #f8e7c8 0%, #f8d0de 58%, #fff8f4 100%);
      box-shadow: 0 0 0 2px rgba(198, 163, 106, 0.6), 0 12px 28px rgba(226, 24, 120, 0.12);
    }
    .opt.picked::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 18% 50%, rgba(255, 244, 220, 0.95), rgba(247, 193, 214, 0.15) 46%, transparent 70%);
      animation: wash 0.42s ease;
    }
    @keyframes wash {
      from { opacity: 0; transform: scale(0.55); }
      to { opacity: 1; transform: none; }
    }

    .name-wrap { margin-top: 8px; }
    label {
      display: block;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input[type="text"] {
      width: 100%;
      border: 1px solid var(--line);
      background: white;
      border-radius: 16px;
      min-height: 58px;
      padding: 0 16px;
      font-size: 18px;
    }
    input[type="text"]::placeholder { color: #8d5a6a; }
    .name .actions { margin-top: 18px; }

    .screen.brew { cursor: pointer; text-align: center; }
    .brew-mid { margin: auto 0; width: 100%; }
    .vials {
      display: flex;
      justify-content: center;
      gap: 22px;
      margin: 0 0 22px;
    }
    .vial-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .vial {
      width: 54px;
      height: 150px;
      border-radius: 22px 22px 16px 16px;
      border: 1.5px solid rgba(198, 163, 106, 0.9);
      position: relative;
      overflow: hidden;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.28) 38%, rgba(255, 255, 255, 0.5));
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.65), 0 12px 24px rgba(92, 32, 56, 0.08);
    }
    .vial .cap {
      position: absolute;
      z-index: 2;
      top: 7px;
      left: 13px;
      right: 13px;
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(#f6ead2, #c6a36a);
    }
    .vial i {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 8%;
      background: linear-gradient(180deg, #f8d0e0 0%, #e21878 42%, #c6a36a 100%);
      animation: fill 1.5s cubic-bezier(.2, .75, .2, 1) forwards;
    }
    .vial i::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: -7px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255, 248, 246, 0.42);
    }
    .vial-col:nth-child(2) .vial i { animation-delay: 0.12s; }
    .vial-col:nth-child(3) .vial i { animation-delay: 0.24s; }
    @keyframes fill { to { height: 78%; } }
    .vial-label {
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--gold-deep);
      font-weight: 700;
      text-align: center;
    }
    .brew h2 { font-size: clamp(32px, 8vw, 40px); }
    .hint-tap {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .screen.result {
      overflow: hidden;
      padding: 0;
    }
    .scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: calc(16px + env(safe-area-inset-top)) 18px 8px;
    }
    .scroll::-webkit-scrollbar { width: 0; height: 0; }
    .result-head { margin: 8px 0 0; }
    .result-head h2 { font-size: clamp(30px, 8vw, 36px); }

    .cards { display: grid; gap: 8px; margin-top: 10px; }
    .card {
      background:
        linear-gradient(#fff, #fffdfb) padding-box,
        linear-gradient(135deg, rgba(226, 24, 120, 0.42), rgba(198, 163, 106, 0.9)) border-box;
      border: 1px solid transparent;
      border-radius: 20px;
      padding: 10px 12px 10px;
      box-shadow: 0 10px 24px rgba(92, 32, 56, 0.05);
      animation: card-in 0.5s cubic-bezier(.2, .7, .2, 1) both;
    }
    .card:nth-child(2) { animation-delay: 0.08s; }
    .card:nth-child(3) { animation-delay: 0.16s; }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: none; }
    }
    .card-top {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .swatch {
      width: 34px;
      height: 46px;
      border-radius: 12px 12px 10px 10px;
      border: 1px solid rgba(198, 163, 106, 0.75);
      position: relative;
      overflow: hidden;
      flex: none;
      background: rgba(255, 255, 255, 0.7);
    }
    .swatch::before {
      content: "";
      position: absolute;
      z-index: 1;
      top: 5px;
      left: 8px;
      right: 8px;
      height: 6px;
      border-radius: 4px;
      background: linear-gradient(#f6ead2, #c6a36a);
    }
    .swatch::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 72%;
      background: linear-gradient(#f7c1d6, #c6a36a);
    }
    .card.apoio .swatch::after {
      height: 58%;
      background: linear-gradient(#f6d5e3, #e7a3b8);
    }
    .card.ritual .swatch::after {
      height: 64%;
      background: linear-gradient(#f3e6cf, #c6a36a);
    }
    .card.estrela .swatch::after {
      height: 80%;
      background: linear-gradient(#f7b7cf, #e21878 68%, #c6a36a);
    }
    .role {
      color: #b31266;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 580;
      margin: 0;
    }
    .card h3 { font-size: 24px; line-height: 1.05; }
    .meta {
      display: flex;
      gap: 8px;
      margin: 8px 0;
      flex-wrap: wrap;
    }
    .pill {
      font-size: 12px;
      border-radius: 999px;
      padding: 4px 9px;
      background: #fff0f5;
      color: var(--deep);
    }
    .pill.gold { background: #f8f1e4; color: var(--gold-deep); }
    .because {
      margin: 0;
      color: var(--muted);
      line-height: 1.3;
      font-size: 14px;
    }

    .note {
      margin-top: 12px;
      background: #fff4ea;
      border-radius: 16px;
      padding: 12px 14px;
      color: #6b4524;
      font-size: 14px;
      line-height: 1.45;
    }

    .dock {
      flex-shrink: 0;
      padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
      background: rgba(255, 246, 243, 0.94);
      border-top: 1px solid rgba(198, 163, 106, 0.4);
      backdrop-filter: blur(12px);
    }
    .dock .btn { min-height: 52px; }

    .toast {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: calc(20px + env(safe-area-inset-bottom));

              <button class="btn gold" type="button" id="whats">Mandar produzir no WhatsApp</button>
            </div>
          </section>`;
      }
    };

    function stepHead(step) {
      const p = ((step + 1) / 4).toFixed(4);
      const n = step + 1;
      return `
        <div class="topbar">
          <button class="back" type="button" data-back>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
            Voltar
          </button>
          <div class="compass" style="--p:${p}" role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="${n}" aria-label="Passo ${n} de 4">
            <span class="well"><i></i></span>
            <svg viewBox="0 0 36 36" aria-hidden="true">
              <circle class="track" cx="18" cy="18" r="15.5"></circle>
              <circle class="value" cx="18" cy="18" r="15.5"></circle>
            </svg>
            <span class="compass-num">${n}</span>
          </div>
        </div>
        <div class="meter" style="--p:${p}" aria-hidden="true"><span></span></div>`;
    }

    function option(item, key, index) {
      const iconName = item.icon || ICON_LIST[index % ICON_LIST.length];
      const icon = ICONS[iconName] || ICONS.spark;
      return `
        <button class="opt" type="button" data-pick="${esc(key)}" data-id="${esc(item.id)}">
          <span class="glyph">${icon}</span>
          <span class="copy"><strong>${esc(item.title)}</strong><small>${esc(item.text)}</small></span>
        </button>`;
    }

    function card(item, index) {
      const tones = ["estrela", "apoio", "ritual"];
      const num = String(index + 1).padStart(2, "0");
      return `
        <article class="card ${tones[index] || "ritual"}">
          <div class="card-top">
            <span class="swatch" aria-hidden="true"></span>
            <div>
              <p class="role">${num} · ${esc(item.role)}</p>
              <h3>${esc(item.name)}</h3>
            </div>
          </div>
          <div class="meta">
            <span class="pill">${esc(item.form)}</span>
            <span class="pill gold">${esc(item.line)}</span>
          </div>
          <p class="because">${esc(item.because)}</p>
        </article>`;
    }

    function go(step, dir) {
      navDir = dir;
      state.step = step;
      render();
    }

    function startBrew() {
      state.step = "brew";
      const token = ++brewToken;
      navDir = 1;
      render();
      const wait = motionOn() ? 1880 : 420;
      brewTimer = setTimeout(() => finishBrew(token), wait);
      const screen = document.querySelector(".screen.brew");
      if (screen) screen.addEventListener("click", () => finishBrew(token));
    }

    function finishBrew(token) {
      if (token !== brewToken) return;
      clearTimeout(brewTimer);
      brewToken += 1;
      navDir = 1;
      state.step = "result";
      render();
    }

    function bind() {
      document.querySelectorAll("[data-go]").forEach((button) => {
        button.addEventListener("click", () => go(button.dataset.go, 1));
      });

      const back = document.querySelector("[data-back]");
      if (back) {
        back.addEventListener("click", () => {
          cancelPending();
          const order = ["name", "goal", "concern", "rhythm"];
          const index = order.indexOf(state.step);
          go(index > 0 ? order[index - 1] : "intro", index > 0 ? -1 : 0);
        });
      }

      const nameNext = document.getElementById("name-next");
      const nameInput = document.getElementById("nome");
      if (nameNext && nameInput) {
        const submit = (skip) => {
          state.name = skip ? "" : nameInput.value.trim();
          nameInput.blur();
          go("goal", 1);
        };
        nameNext.addEventListener("click", () => submit(false));
        document.getElementById("name-skip").addEventListener("click", () => submit(true));
        nameInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter") submit(false);
        });
        nameInput.focus({ preventScroll: true });
      }

      document.querySelectorAll("[data-pick]").forEach((button) => {
        button.addEventListener("click", () => {
          if (advancing) return;
          advancing = true;
          const key = button.dataset.pick;
          const id = button.dataset.id;
          if (key === "goal" && state.goal !== id) state.concern = "";
          state[key] = id;
          button.classList.add("picked");
          const group = button.closest(".options");
          if (group) group.classList.add("is-frozen");
          const wait = motionOn() ? 420 : 90;
          pickTimer = setTimeout(() => {
            advancing = false;
            if (key === "rhythm") {
              startBrew();
              return;
            }
            navDir = 1;
            if (key === "goal") state.step = "concern";
            if (key === "concern") state.step = "rhythm";
            render();
          }, wait);
        });
      });

      const whats = document.getElementById("whats");
      if (whats) whats.addEventListener("click", () => sendWhatsapp(buildTrio()));
    }

    render();
  </script>
</body>
</html>
